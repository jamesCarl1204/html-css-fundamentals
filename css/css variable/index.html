   <button onclick="myFunc_get()"> get var with js</button>
   <button  onclick="myFunc_set()"> change var with js</button>
 
   <script>
    var r = document.querySelector(':root');

    function myFunc_get() {
        var rs = getComputedStyle(r)

        alert("the value of --primary-bg-color is: " + rs.getPropertyValue('--primary-bg-color'))
    }

    function myFunc_set() {
        r.style.setProperty('--primary-bg-color', 'green')
    }
   </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

      <h1 id="try" >javascript can change the style of an html elements</h1>
      
      <button onclick="myfunc()">click me</button>

    

    <script>
        function myfunc() {
            document.getElementById("try").style.fontSize = "25px";

            document.getElementById("try").style.color = "blue"

            document.getElementById("try").style.backgroundColor = "green"
        }


        
    </script>
</body>
</html>
